<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Hashi</title>
<defs>
<clipPath id="sq"><rect width="512" height="512" rx="116"/></clipPath>
<linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512"><stop offset="0" stop-color="#17352b"/><stop offset="1" stop-color="#07130f"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#7DF2B8" stop-opacity=".75"/><stop offset="1" stop-color="#7DF2B8" stop-opacity="0"/></radialGradient>
<linearGradient id="body" gradientUnits="userSpaceOnUse" x1="60" y1="40" x2="460" y2="470"><stop offset="0" stop-color="#C6FFE0"/><stop offset=".55" stop-color="#5BE9A4"/><stop offset="1" stop-color="#1FA36E"/></linearGradient>
<filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
